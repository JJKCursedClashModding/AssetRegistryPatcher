name: build

# Every push / PR: build + test + exe (artifact).
# Tag v*: also publish bin/AssetRegistryGenerator.exe as a GitHub release asset.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:exe
      - name: Smoke test exe
        shell: bash
        run: |
          ./bin/AssetRegistryGenerator.exe 2>&1 | head -5 || true
          test -s bin/AssetRegistryGenerator.exe
      - name: SHA-256
        shell: bash
        run: cd bin && sha256sum AssetRegistryGenerator.exe > AssetRegistryGenerator.exe.sha256 && cat AssetRegistryGenerator.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AssetRegistryGenerator
          path: bin/AssetRegistryGenerator.exe*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" bin/AssetRegistryGenerator.exe bin/AssetRegistryGenerator.exe.sha256 --clobber
